name: Publish pde-003 Zhihu asset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-pde003.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SVG renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin

      - name: Render public PNG and update manifest
