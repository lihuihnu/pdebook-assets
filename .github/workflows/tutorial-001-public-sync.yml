          }

          files=[]
          for out,(source,source_blob) in sorted(source_map.items()):
              files.append({
                "source":source,"source_blob_sha":source_blob,
                "output":out,"output_blob_sha":blob(out),
              })
          data["code"].append({
            "article_id":"tutorial-001","source":"experiments/tutorial-001",
            "output":"code/tutorial-001",
            "entrypoint":"code/tutorial-001/src/composite_heat.py",
            "command":"python code/tutorial-001/src/composite_heat.py --config code/tutorial-001/config/uniform.json --output reproduced/et001-01",
            "dependencies":["numpy==2.3.5","scipy==1.17.0"],
            "files":files,
            "url":"https://github.com/lihuihnu/pdebook-assets/tree/main/code/tutorial-001",
          })
          manifest_path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          readme=Path("README.md")
          text=readme.read_text(encoding="utf-8")
          line="- `code/tutorial-001/` — 复合材料中的二维稳态导热；6 组实验、5 份正式图件生成脚本与公开重跑结果；NumPy/SciPy 数值核心。"
          if line not in text:
              readme.write_text(text.rstrip()+"\n"+line+"\n",encoding="utf-8")
          PY

      - name: Final public-tree checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(find assets/tutorial-001 -maxdepth 1 -name '*.png' | wc -l)" -eq 5
          test "$(find code/tutorial-001/results -type f | wc -l)" -eq 23
          grep -q '"article_id": "tutorial-001"' manifest.json
          grep -q 'code/tutorial-001/' README.md
          test -f code/tutorial-001/results/et001-04/faces.csv
          test -f code/tutorial-001/results/et001-06/faces.csv

      - name: Commit synced tutorial and remove staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tutorial-001-public-sync.yml
          git rm -r _staging/tutorial-001
          git add assets/tutorial-001 code/tutorial-001 manifest.json README.md
          git commit -m "Publish tutorial-001 assets, code and actual results"
          git push origin HEAD:main
