            "code/tutorial-001/src/composite_heat.py":("experiments/tutorial-001/src/composite_heat.py","be4d7e82ce473c0259017813a2b2b5f580d891fa"),
            "code/tutorial-001/src/averaging_ablation.py":("experiments/tutorial-001/src/averaging_ablation.py","26d3d447bc04ca8fb414477a697b11aad38bec2f"),
            "code/tutorial-001/src/inclusion_refinement.py":("experiments/tutorial-001/src/inclusion_refinement.py","88abe32035a3ca5b78f47b75e1d66f4b4b19642a"),
            "code/tutorial-001/src/conservation_audit.py":("experiments/tutorial-001/src/conservation_audit.py","dd8ffbb1238aa67ecb3d4483c75f5efab8447168"),
            "code/tutorial-001/src/contrast_sweep.py":("experiments/tutorial-001/src/contrast_sweep.py","bb922b93f4f359c462fde75b7dffc1a9d3b7fe2c"),
            "code/tutorial-001/src/make_FT001_01.py":("figures/tutorial-001/src/make_FT001_01.py","0f827d058bbfaf2cec25b867000418bd02892bc5"),
            "code/tutorial-001/src/make_FT001_02.py":("figures/tutorial-001/src/make_FT001_02.py","92d90101987e8d4f322ed3b732764a821b9baad9"),
            "code/tutorial-001/src/make_FT001_03.py":("figures/tutorial-001/src/make_FT001_03.py","a6410544fa5cde5dd3c48be6e1bf7917f66ebe17"),
            "code/tutorial-001/src/make_FT001_04.py":("figures/tutorial-001/src/make_FT001_04.py","68b392cf0791b49be000cd28acaff17d75af7a10"),
            "code/tutorial-001/src/make_FT001_05.py":("figures/tutorial-001/src/make_FT001_05.py","a3f67a8786358a9d10c1323d2f83c8a293c4e54b"),
            "code/tutorial-001/config/uniform.json":("experiments/tutorial-001/config/uniform.json","87d3158fdf10d5a39b79cd68680a945433f7f519"),
            "code/tutorial-001/config/layered.json":("experiments/tutorial-001/config/layered.json","334151c99622a4c13fb5ab23522e372c970bf3b7"),
            "code/tutorial-001/config/averaging_ablation.json":("experiments/tutorial-001/config/averaging_ablation.json","d6c6d720e9ffe17c8fbd8465ca6496293fd514f5"),
            "code/tutorial-001/config/inclusion.json":("experiments/tutorial-001/config/inclusion.json","f3ebfc03ab8ae9e577804e4d1c2e032afbb0816d"),
            "code/tutorial-001/config/contrast_sweep.json":("experiments/tutorial-001/config/contrast_sweep.json","16defdffce4e4feb60aece3f52312e179320fb8f"),
            "code/tutorial-001/results/et001-01/cells.csv":("experiments/tutorial-001/results/et001-01/cells.csv","0383eabce154f7db9831e9a5e2b50c4783b88c5e"),
            "code/tutorial-001/results/et001-01/run.txt":("experiments/tutorial-001/results/et001-01/run.txt","af9bd8bff0cd84fa4c39c1a66c9b342821169663"),
            "code/tutorial-001/results/et001-01/summary.csv":("experiments/tutorial-001/results/et001-01/summary.csv","db85dc5393028e0493d9ebaa5ef189426cb45456"),
            "code/tutorial-001/results/et001-02/cells.csv":("experiments/tutorial-001/results/et001-02/cells.csv","48a0a5fc78801239ed625a83ca34c8d3c221c887"),
            "code/tutorial-001/results/et001-02/faces.csv":("experiments/tutorial-001/results/et001-02/faces.csv","e02a9b1b13ef5ba90f80596228f90db1d138658b"),
            "code/tutorial-001/results/et001-02/layered_profile.csv":("experiments/tutorial-001/results/et001-02/layered_profile.csv","f5e945d28807ceeb417e7bb8616236fa85597b0e"),
            "code/tutorial-001/results/et001-02/run.txt":("experiments/tutorial-001/results/et001-02/run.txt","50a91dcc02d41ff043101aff3e0c39b71d164858"),
