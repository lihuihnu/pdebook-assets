name: Temporary tutorial-001 public sync

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tutorial-001-public-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install numerical and raster dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin fonts-noto-cjk fonts-stix
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0

      - name: Regenerate ET001-01 through ET001-06
        shell: bash
        run: |
          set -euo pipefail
          rm -rf code/tutorial-001/results
          mkdir -p code/tutorial-001/results

          python code/tutorial-001/src/composite_heat.py             --config code/tutorial-001/config/uniform.json             --output code/tutorial-001/results/et001-01

          python code/tutorial-001/src/composite_heat.py             --config code/tutorial-001/config/layered.json             --output code/tutorial-001/results/et001-02

          python code/tutorial-001/src/averaging_ablation.py             --config code/tutorial-001/config/averaging_ablation.json             --output code/tutorial-001/results/et001-03

          python code/tutorial-001/src/inclusion_refinement.py             --config code/tutorial-001/config/inclusion.json             --output code/tutorial-001/results/et001-04

          python code/tutorial-001/src/conservation_audit.py             --source code/tutorial-001/results/et001-04             --output code/tutorial-001/results/et001-05

          python code/tutorial-001/src/contrast_sweep.py             --config code/tutorial-001/config/contrast_sweep.json             --et004-summary code/tutorial-001/results/et001-04/summary.csv             --output code/tutorial-001/results/et001-06

      - name: Check regenerated scientific evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          from pathlib import Path

          base=Path("code/tutorial-001/results")
          def rows(path):
              with Path(path).open("r",encoding="utf-8",newline="") as f:
                  return list(csv.DictReader(f))
          def close(a,b,tol=2e-10):
              return abs(a-b) <= tol*max(1.0,abs(a),abs(b))

          # ET001-01
          e1=rows(base/"et001-01/summary.csv")
          assert len(e1)==3
          assert max(float(r["max_temperature_error"]) for r in e1) <= 1e-9
          assert all(abs(float(r["q_hot"])-0.5333333333333333) <= 1e-10 for r in e1)
          assert all(float(r["global_balance_relative"]) <= 1e-10 for r in e1)

          # ET001-02
          e2=rows(base/"et001-02/summary.csv")
          assert len(e2)==4
          assert max(float(r["max_temperature_error"]) for r in e2) <= 1e-9
          assert all(abs(float(r["q_hot"])-0.9696969696969697) <= 1e-10 for r in e2)
          assert all(abs(float(r["interface_temperature_exact"])-27.27272727272727) <= 1e-10 for r in e2)

          # ET001-03
          e3=rows(base/"et001-03/averaging_ablation.csv")
          assert len(e3)==32
          harm=[r for r in e3 if r["scheme"]=="harmonic_frozen"]
          assert all(float(r["q_hot_relative_error_physical"]) <= 1e-9 for r in harm)
          def one(chi,nx,scheme):
              z=[r for r in e3 if float(r["contrast"])==chi and int(r["nx"])==nx and r["scheme"]==scheme]
              assert len(z)==1
              return z[0]
          assert abs(100*float(one(10.0,6,"arithmetic_ablation")["q_hot_relative_error_physical"])-12.5581395349) < 1e-6
          assert abs(100*float(one(100.0,6,"arithmetic_ablation")["q_hot_relative_error_physical"])-19.0662386927) < 1e-6

          # ET001-04
          e4=rows(base/"et001-04/summary.csv")
          ref=[0.620254041711,0.621921104475,0.622546238284,0.622776449453]
          assert len(e4)==4
          for r,q in zip(e4,ref):
              assert abs(float(r["q_hot"])-q) < 2e-10
              assert float(r["global_balance_relative"]) <= 1e-10
          rr=rows(base/"et001-04/refinement.csv")
          assert float(rr[-1]["q_hot_relative_change_from_previous"]) <= 0.005
          assert float(e4[-1]["max_column_temperature_range"]) > 6.0
          assert float(e4[-1]["max_abs_internal_y_flux"]) > 0.0

          # ET001-05
          e5=rows(base/"et001-05/audit_summary.csv")
          assert len(e5)==4
          for r in e5:
              for k in ("global_balance_relative","max_cell_balance_relative",
                        "inclusion_balance_relative","adiabatic_boundary_relative",
                        "cell_sum_boundary_consistency_relative",
                        "internal_pair_cancellation_relative"):
                  assert float(r[k]) <= 1e-10
          with (base/"et001-05/balances.csv").open("r",encoding="utf-8") as f:
              assert sum(1 for _ in f)==32641

          # ET001-06
          e6=rows(base/"et001-06/contrast_sweep.csv")
          assert [float(r["contrast"]) for r in e6] == [0.1,0.3,1.0,3.0,10.0,30.0,100.0,300.0,1000.0]
          m={float(r["contrast"]):r for r in e6}
          assert close(float(m[1.0]["q_hot"]),0.5333333333333333)
          assert close(float(m[1.0]["k_eff"]),1.0)
          assert close(float(m[10.0]["q_hot"]),float(e4[2]["q_hot"]))
          q=[float(r["q_hot"]) for r in e6]
          assert all(b>a for a,b in zip(q,q[1:]))
          for r in e6:
              for k in ("global_balance_relative","max_cell_balance_relative",
                        "inclusion_balance_relative","adiabatic_boundary_relative",
                        "cell_sum_boundary_consistency_relative",
                        "internal_pair_cancellation_relative"):
                  assert float(r[k]) <= 1e-10
          print("PASS: tutorial-001 public regenerated scientific evidence")
          PY

      - name: Rasterize final private canonical SVGs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/tutorial-001
          for name in             FT001-01_composite_plate_geometry             FT001-02_series_resistance             FT001-03_interface_validation             FT001-04_temperature_and_heatflow             FT001-05_contrast_sweep
          do
            rsvg-convert --width 1920 --keep-aspect-ratio --background-color white               --output "assets/tutorial-001/${name}.png"               "_staging/tutorial-001/${name}.svg"
          done

          echo "5ce631c159590542c648b57060865279dfdbb23e816183673ff4068ed1965c67  assets/tutorial-001/FT001-01_composite_plate_geometry.png" | sha256sum -c -
          echo "45b983e59dda21d269752475565a5ee971d10c626c83b69a52b206e0cb33b3cc  assets/tutorial-001/FT001-02_series_resistance.png" | sha256sum -c -
          echo "f387bd1dc54b242596fa18e4d1e87f52381d6d277f0ab83c7f9671e1cfb33ca8  assets/tutorial-001/FT001-03_interface_validation.png" | sha256sum -c -
          echo "95025aa484b3fd34a7162b207e9b7226613c9a30c2c9873a2d82a3f4987259bb  assets/tutorial-001/FT001-04_temperature_and_heatflow.png" | sha256sum -c -
          echo "e048e103dcaf74d126a1748c872c47a5886a897feb50ebf0541d1aeee4cbfdc7  assets/tutorial-001/FT001-05_contrast_sweep.png" | sha256sum -c -

      - name: Update public manifest and README
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import struct
          import subprocess
          from pathlib import Path

          def blob(path):
              return subprocess.check_output(["git","hash-object",str(path)],text=True).strip()
          def png_size(path):
              with open(path,"rb") as f:
                  assert f.read(8)==b"\x89PNG\r\n\x1a\n"
                  length=struct.unpack(">I",f.read(4))[0]
                  assert f.read(4)==b"IHDR" and length>=8
                  return struct.unpack(">II",f.read(8))

          manifest_path=Path("manifest.json")
          data=json.loads(manifest_path.read_text(encoding="utf-8"))
          data["assets"]=[x for x in data.get("assets",[]) if x.get("article_id")!="tutorial-001"]
          data["code"]=[x for x in data.get("code",[]) if x.get("article_id")!="tutorial-001"]

          asset_specs=[
            ("figures/tutorial-001/exports/FT001-01_composite_plate_geometry.svg","af055f3580c04afe54f09c306e0b1102bf39d045","FT001-01_composite_plate_geometry.png"),
            ("figures/tutorial-001/exports/FT001-02_series_resistance.svg","12ecfbe9e0f9f25c79793168804517356daeac02","FT001-02_series_resistance.png"),
            ("figures/tutorial-001/exports/FT001-03_interface_validation.svg","66198f86063d2d6be9e17c4c75ec69cd4befe539","FT001-03_interface_validation.png"),
            ("figures/tutorial-001/exports/FT001-04_temperature_and_heatflow.svg","48cb8d1f4f211307f7d2d37a7881a7c51ba435e7","FT001-04_temperature_and_heatflow.png"),
            ("figures/tutorial-001/exports/FT001-05_contrast_sweep.svg","f47697929b4b4cb098ba4f141a10729ab72ad7f9","FT001-05_contrast_sweep.png"),
          ]
          for source,source_blob,name in asset_specs:
              out=Path("assets/tutorial-001")/name
              w,h=png_size(out)
              assert w==1920
              data["assets"].append({
                "article_id":"tutorial-001","source":source,
                "source_blob_sha":source_blob,"output":str(out),
                "output_blob_sha":blob(out),"width_px":w,"height_px":h,
                "url":f"https://raw.githubusercontent.com/lihuihnu/pdebook-assets/main/assets/tutorial-001/{name}",
              })

