            "code/tutorial-001/results/et001-04/run.txt":("experiments/tutorial-001/results/et001-04/run.txt","187a87a665303e0cf350a7c906cc6a29fb8ef2c0"),
            "code/tutorial-001/results/et001-04/summary.csv":("experiments/tutorial-001/results/et001-04/summary.csv","814f1c53834ee194074491b2a8c32d3ee07b5568"),
            "code/tutorial-001/results/et001-05/audit_summary.csv":("experiments/tutorial-001/results/et001-05/audit_summary.csv","d41f73e77ac166d7922f30c6b287c9cc7cf1255e"),
            "code/tutorial-001/results/et001-05/balances.csv":("experiments/tutorial-001/results/et001-05/balances.csv","18f9303394a4136b4d21defb002899b373e6e4ca"),
            "code/tutorial-001/results/et001-05/run.txt":("experiments/tutorial-001/results/et001-05/run.txt","2daa3049085851c136ba2100ffdef24fdcac2614"),
            "code/tutorial-001/results/et001-06/balances.csv":("experiments/tutorial-001/results/et001-06/balances.csv","cbfb4c3682b7d705af18a890b9a6c1e0b5285a0e"),
            "code/tutorial-001/results/et001-06/cells.csv":("experiments/tutorial-001/results/et001-06/cells.csv","2b941b00c3e651bfee80ee5e2c5a4353f36e99b2"),
