name: Temporary commit pde-001 PNGs

on:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out public asset repository
        uses: actions/checkout@v4

      - name: Download already-rendered PNG artifact
        run: |
          mkdir -p /tmp/pde001 assets/pde-001
          gh api             repos/${GITHUB_REPOSITORY}/actions/artifacts/10873427798/zip             > /tmp/pde001.zip
          unzip -o /tmp/pde001.zip -d /tmp/pde001
          find /tmp/pde001 -maxdepth 2 -type f -print
          cp /tmp/pde001/fig-001-function-to-field.png assets/pde-001/
          cp /tmp/pde001/fig-002-heat-solution.png assets/pde-001/

      - name: Verify PNG dimensions
        run: |
          file assets/pde-001/*.png
          python - <<'PY'
          import struct
          from pathlib import Path
          expected = {
              "fig-001-function-to-field.png": (1920, 902),
              "fig-002-heat-solution.png": (1920, 1110),
          }
          for path in sorted(Path("assets/pde-001").glob("*.png")):
              with path.open("rb") as f:
                  assert f.read(8) == b"\x89PNG\r\n\x1a\n"
                  length = struct.unpack(">I", f.read(4))[0]
                  assert f.read(4) == b"IHDR"
                  width, height = struct.unpack(">II", f.read(8))
              assert (width, height) == expected[path.name], (path, width, height)
              print(path, width, height)
          PY

      - name: Write manifest
        run: |
          cat > manifest.json <<'JSON'
          {
            "schema_version": 1,
            "assets": [
              {
                "article_id": "pde-001",
                "source": "figures/pde-001/exports/fig-001-function-to-field.svg",
                "source_blob_sha": "3bc3e46bdb9a4289d10eef3cb60eb8218b1d8929",
                "output": "assets/pde-001/fig-001-function-to-field.png",
                "width_px": 1920,
                "height_px": 902,
                "url": "https://raw.githubusercontent.com/lihuihnu/pdebook-assets/main/assets/pde-001/fig-001-function-to-field.png"
              },
              {
                "article_id": "pde-001",
                "source": "figures/pde-001/exports/fig-002-heat-solution.svg",
                "source_blob_sha": "fe6ae2ae16c5167845cfb83ab731579572e659ef",
                "output": "assets/pde-001/fig-002-heat-solution.png",
                "width_px": 1920,
                "height_px": 1110,
                "url": "https://raw.githubusercontent.com/lihuihnu/pdebook-assets/main/assets/pde-001/fig-002-heat-solution.png"
              }
            ]
          }
          JSON

      - name: Commit generated PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pde-001 manifest.json
          if git diff --cached --quiet; then
            echo "No asset changes."
            exit 0
          fi
          git commit -m "assets: add pde-001 Zhihu PNGs"
          git push
